aid: microhealth
name: Microhealth
description: >-
  Microhealth is a Y Combinator (S15) digital-health company building digital
  therapeutics and connected patient-provider networks for people living with
  rare bleeding disorders such as hemophilia and for sickle cell disease. Its
  products let patients track, manage, and share their treatment journey while
  giving clinicians real-time monitoring between visits, and it aggregates
  anonymized real-world evidence for life-science and pharmaceutical research.
  Products include Microhealth Bleeding Disorders (patient) and Rare Bleeding
  Disorders HCP (clinician dashboard), Microhealth SCD and SCD HCP for sickle
  cell disease, and life-science research tooling. The company validates
  interventions through clinical studies toward regulatory clearance as
  Software as a Medical Device (SaMD). Its hemophilia network is reported to
  cover roughly a third of US patients and providers in the specialty, with
  pharmaceutical clients including Sanofi, Bayer, Novo Nordisk, Biogen, and
  Roche. Microhealth is a patient- and clinician-facing application platform
  and does not currently publish a public developer API, SDKs, or developer
  portal.
